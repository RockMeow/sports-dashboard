<!doctype html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="300">
<title>賽事儀表板</title>
<style>
:root{--bg:#080d18;--panel:#101827;--panel2:#0c1422;--line:#22304a;--text:#edf3ff;--muted:#8ea0bd;--accent:#79a7ff;--good:#48d597;--bad:#ff7272;--warn:#f4c85c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}button{font:inherit}
.app{max-width:1440px;margin:auto;padding:18px}.topbar{position:sticky;top:0;z-index:20;background:rgba(8,13,24,.94);backdrop-filter:blur(12px);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;gap:12px;align-items:end}.brand h1{font-size:24px;margin:0}.muted{color:var(--muted)}#updated{font-size:13px}
.sportnav,.subnav,.legend,.leaguechips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.sportnav{margin-top:12px}.navbtn,.pill{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer}.navbtn.active,.pill.active{border-color:var(--accent);background:#14213a}
.view{display:none}.view.active{display:block}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}.section-title h2{font-size:18px;margin:0}
.grid,.stats,.matchcards{display:grid;gap:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(6,minmax(0,1fr))}.matchcards{grid-template-columns:repeat(3,minmax(0,1fr))}
.card,.healthbox,.match,.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px}.card{padding:16px}.healthbox,.match{padding:14px}.stat{padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.good,.hit,.stage.ready{color:var(--good)}.miss{color:var(--bad)}.pending,.stage{color:var(--muted)}
.teams{font-weight:700;margin:9px 0 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.team{display:flex;align-items:center;gap:7px;min-width:0}.team:last-child{justify-content:flex-end;text-align:right}.crest{width:28px;height:28px;border-radius:50%;background:#17233a;border:1px solid #344565;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex:0 0 28px;overflow:hidden}.crest img{width:24px;height:24px;object-fit:contain}.versus,.matchtime,.healthmeta{font-size:12px;color:var(--muted)}.result{float:right;font-weight:800}.choice{font-size:16px;font-weight:800}.recommend-tag{display:inline-block;background:var(--accent);color:#07101f;border-radius:6px;padding:2px 6px;margin-right:6px;font-size:11px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.meta span{font-size:12px;background:var(--panel2);border-radius:7px;padding:4px 7px}.reason{margin-top:9px;padding:8px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:6px;font-size:12px;line-height:1.5}
.healthbar{height:7px;background:#070d18;border-radius:99px;overflow:hidden;margin:9px 0}.healthbar i{display:block;height:100%;background:var(--accent)}.leaguechip{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}.leaguechip b{display:block;font-size:14px;margin-top:2px}.schedule-list{display:grid;gap:6px;margin-top:10px}.schedule-row{display:grid;grid-template-columns:70px 140px 1fr;gap:10px;background:var(--panel2);border-radius:9px;padding:8px 10px;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}.section-gap{margin-top:12px}.today-list{display:grid;gap:7px}.today-row{display:grid;grid-template-columns:72px 115px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:9px 10px;font-size:13px}.today-row.has-pick{border-color:var(--accent)}.tag,.status-badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 7px;white-space:nowrap}.tag.picktag,.status-badge.ready{color:var(--good);border-color:var(--good);background:rgba(72,213,151,.08)}.status-badge.open{color:var(--warn);border-color:var(--warn);background:rgba(244,200,92,.08)}.status-badge.settled{color:var(--accent);border-color:var(--accent);background:rgba(121,167,255,.08)}.status-badge.building{color:var(--muted)}.status-badge.bad{color:var(--bad);border-color:var(--bad)}.match.open-card{border-color:rgba(244,200,92,.5)}.match.win-card{border-color:rgba(72,213,151,.5)}.match.loss-card{border-color:rgba(255,114,114,.45)}.healthbox[data-state="ready"]{border-color:rgba(72,213,151,.45)}.healthbox[data-state="building"]{border-color:var(--line)}.section-kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}.league-filter{display:flex;gap:7px;overflow:auto;margin:12px 0;scrollbar-width:none}.league-filter .pill{padding:7px 10px}.schedule-row.hidden{display:none}.asia-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.asia-panel+.asia-panel{margin-top:18px}.asia-title{margin:0 2px 10px}.asia-subtitle{margin:18px 2px 8px}.asia-stats{margin-bottom:4px}
@media(max-width:1000px){.matchcards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.today-row{grid-template-columns:58px 82px 1fr}.today-row .tag{grid-column:2/4;width:max-content}.app{padding:10px}.brand{align-items:start;flex-direction:column}.brand h1{font-size:20px}.grid,.matchcards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:12px}.schedule-row{grid-template-columns:60px 90px 1fr}.sportnav{margin-left:-2px;margin-right:-2px}}
</style></head>
<body><main class="app">
<header class="topbar"><div class="brand"><div><h1>賽事儀表板</h1><div class="muted">多球種模型・賽程・模擬推薦</div></div><div><div id="updated" class="muted">資料載入中…</div><div id="sync-health" class="muted" style="font-size:12px;margin-top:3px">同步狀態：檢查中…</div></div></div>
<nav class="sportnav"><button class="navbtn active" data-view="overview">🏟️ 全部賽事</button><button class="navbtn" data-view="recommended">⭐ 有推薦</button><button class="navbtn" data-view="history">📚 紀錄</button></nav></header>

<section class="view active" id="view-overview">
<div class="section-title"><h2>🏟️ 今日全部賽事</h2><span class="muted">台灣時間・MLB / NPB / KBO / 足球 / NFL</span></div>
<section class="card"><div class="stats" id="all-games-summary"></div><div class="sportnav section-gap" id="game-filters"><button class="pill active" data-game-filter="all">全部</button><button class="pill" data-game-filter="baseball">⚾ 棒球</button><button class="pill" data-game-filter="football">⚽ 足球</button><button class="pill" data-game-filter="nfl">🏈 美足</button></div><div id="today-center" class="today-list section-gap"><div class="empty">載入中…</div></div></section>
<div class="section-title"><h2>賽前盤口狀態</h2><span class="muted">僅顯示需要注意的抓取狀態</span></div><section class="card"><div id="collection-health"><div class="empty">載入中…</div></div></section>
</section>

<section class="view" id="view-recommended">
<div class="section-title"><h2>⭐ 有推薦</h2><span class="muted">只顯示模型目前有推薦的賽事</span></div>
<section class="card"><div class="stats" id="recommend-summary"></div></section>
<div class="section-title"><h2>⚾ 棒球推薦</h2></div><div class="matchcards" id="baseball-recommendations"></div>
<div class="section-title"><h2>⚽ 足球推薦</h2></div><div class="matchcards" id="football-picks"></div>
<div class="section-title"><h2>🏈 美足推薦</h2></div><div class="matchcards" id="nfl-picks"></div>
</section>

<section class="view" id="view-history"><div class="section-title"><h2>📚 歷史預測紀錄</h2></div><section class="card"><div class="legend"><button class="pill filter active" data-sport="mlb">⚾ 美職</button><button class="pill filter" data-sport="football">⚽ 足球</button><button class="pill status active" data-status="all">全部</button><button class="pill status" data-status="open">待結算</button><button class="pill status" data-status="settled">已結算</button></div><div class="matchcards section-gap" id="history-picks"></div></section></section>
</main><script src="dashboard.js?v=20260923-simple-games-recommend1"></script></body></html>
