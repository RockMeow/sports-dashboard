<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="300"><title>棒球・足球研究儀表板</title><style>:root{--bg:#0b1020;--card:#121a2d;--line:#24304b;--text:#edf2ff;--muted:#98a7c2;--good:#42d392;--bad:#ff6b6b;--warn:#f6c85f;--accent:#7aa2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}main{max-width:1180px;margin:auto;padding:24px}h1{margin:0 0 4px}h2{font-size:18px}.muted{color:var(--muted)}.grid,.stats{display:grid;gap:12px}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.stat{background:#0d1527;border-radius:12px;padding:12px}.stat b{display:block;font-size:19px;margin-top:4px}.good{color:var(--good)}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}.filter,.status{color:var(--text);cursor:pointer}.filter.active,.status.active{border-color:var(--accent)}.pill{background:#0d1527;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px}.pick{font-weight:700}.matchcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d1527;border:1px solid var(--line);border-radius:14px;padding:14px}.matchtime{font-size:12px;color:var(--muted);margin-bottom:7px}.result{float:right;font-weight:800}.pending{color:var(--muted)}.hit{color:var(--good)}.miss{color:var(--bad)}.teams{font-weight:700;margin-bottom:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.team{display:flex;align-items:center;gap:8px;min-width:0}.team:last-child{justify-content:flex-end;text-align:right}.crest{width:30px;height:30px;border-radius:50%;background:#1c2944;border:1px solid #344565;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 30px;overflow:hidden}.crest img{width:26px;height:26px;object-fit:contain}.versus{color:var(--muted);font-size:12px;font-weight:500}.choice{font-size:18px;font-weight:800}.recommended{border:1px solid var(--accent);box-shadow:0 0 0 1px rgba(122,162,255,.15),0 8px 24px rgba(0,0,0,.18)}.recommend-tag{display:inline-block;background:var(--accent);color:#081126;border-radius:7px;padding:3px 7px;margin-right:8px;font-size:12px;font-weight:900;vertical-align:2px}.healthbar{height:8px;background:#0b1020;border-radius:99px;overflow:hidden;margin:10px 0}.healthbar i{display:block;height:100%;background:var(--accent);border-radius:99px}.healthbox{background:#0d1527;border:1px solid var(--line);border-radius:12px;padding:13px}.healthbox b{font-size:16px}.healthmeta{font-size:13px;color:var(--muted);line-height:1.55}.reason{margin-top:10px;padding:9px 10px;border-left:3px solid var(--accent);background:#121a2d;border-radius:6px;font-size:13px;line-height:1.55;color:#cbd7ed}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.meta span{font-size:13px;background:#121a2d;border-radius:8px;padding:5px 8px}.desktop-only{display:table-cell}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.scroll{overflow:auto}footer{text-align:center;color:var(--muted);padding:20px}@media(max-width:760px){main{padding:14px}.grid,.matchcards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.desktop-only{display:none}th,td{padding:10px 6px}.card{padding:14px}}</style></head><body><main><h1>⚾ 棒球・⚽ 足球預測看板</h1><div class="muted">直接看比賽、選擇、賠率與預測強度｜時間皆為台灣時間</div><div class="legend"><span class="pill">與市場差距：模型比市場更看好多少</span><span class="pill">預估價值：依目前賠率估算</span></div><div class="grid"><section class="card"><h2>⚾ 棒球 今日概況</h2><div class="stats" id="mlb-summary"><div class="stat">資料<b>載入中…</b></div></div></section><section class="card"><h2>⚽ 足球 今日概況</h2><div class="stats" id="football-summary"><div class="stat">資料<b>載入中…</b></div></div></section></div><section class="card"><h2>⚾ 棒球 目前觀察名單</h2><div class="matchcards" id="mlb-picks"><div class="muted">載入中…</div></div></section><section class="card"><h2>⚽ 足球 目前觀察名單</h2><div class="matchcards" id="football-picks"><div class="muted">載入中…</div></div></section><section class="card"><h2>🧠 模型健康度</h2><div class="grid" id="model-health"><div class="muted">載入中…</div></div></section><section class="card"><h2>📚 歷史預測紀錄</h2><div class="legend"><button class="pill filter active" data-sport="mlb">⚾ 棒球</button><button class="pill filter" data-sport="football">⚽ 足球</button><button class="pill status active" data-status="all">全部</button><button class="pill status" data-status="open">待結算</button><button class="pill status" data-status="settled">已結算</button></div><div class="matchcards" id="history-picks"><div class="muted">載入中…</div></div></section><div id="updated" class="muted" style="text-align:center"></div><footer>此看板用來追蹤模型預測與結果，不代表一定獲利。</footer></main><script src="dashboard.js?v=20260920-health"></script></body></html>
